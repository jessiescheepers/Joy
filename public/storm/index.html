<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Joy — Design Partner Portal</title>
<meta name="theme-color" content="#07060f" />
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap" rel="stylesheet" />
<link rel="preload" as="image" href="assets/joy-logo-white.png" />
<link rel="preload" as="image" href="assets/mist1.png" />
<link rel="preload" as="image" href="assets/mist2.png" />
<link rel="preload" as="image" href="assets/clouds.png" />
<style>
  @font-face{
    font-family:"FoundryGridnik";
    src:url("fonts/FoundryGridnik-Regular.otf") format("opentype");
    font-weight:400;font-style:normal;font-display:swap
  }
  @font-face{
    font-family:"FoundryGridnik";
    src:url("fonts/FoundryGridnik-Bold.otf") format("opentype");
    font-weight:700;font-style:normal;font-display:swap
  }
  :root{ --col-head:clamp(200px, 38vw, 420px); }
  *{box-sizing:border-box}
  html{height:100%}
  body{
    margin:0;
    background:#07060f;
    color:#f3f0ff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    height:300vh;
  }

  /* ---- scene (fixed sky background) ---- */
  .scene{
    position:fixed; inset:0; z-index:0; overflow:hidden;
    opacity:0; transition:opacity 1s ease;
  }
  .scene.ready{ opacity:1; }

  .sky-calm{
    position:absolute; inset:0;
    background:radial-gradient(125% 95% at 50% 30%, #2c4454 0%, #273f4d 52%, #1c2f37 100%);
  }
  .sky-overcast{
    position:absolute; inset:0;
    background:radial-gradient(125% 95% at 50% 30%, #363040 0%, #2e2838 52%, #1f1a28 100%);
    opacity:0;
  }
  .haze{
    position:absolute; inset:0; z-index:1.5;
    background:radial-gradient(120% 80% at 50% 40%, rgba(45,38,55,0.85), rgba(30,25,40,0.7) 60%, rgba(20,16,28,0.9));
    opacity:0; pointer-events:none;
  }

  .scene .layer{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:118%; height:118%;
    object-fit:cover;
    will-change:transform,opacity;
    pointer-events:none;
  }
  .layer-stars{
    position:absolute; inset:0; width:100%; height:100%;
    z-index:1; pointer-events:none;
    -webkit-mask-image:linear-gradient(to bottom, #000 44%, rgba(0,0,0,0.35) 70%, transparent 88%);
    mask-image:linear-gradient(to bottom, #000 44%, rgba(0,0,0,0.35) 70%, transparent 88%);
  }
  .scene .mist1{ z-index:2; opacity:1; }
  .scene .clouds{
    position:absolute; inset:0; width:100%; height:100%;
    z-index:3; pointer-events:none;
  }
  .scene .mist2{ z-index:4; opacity:1; }

  .vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(135% 105% at 50% 42%, rgba(0,0,0,0) 58%, rgba(0,0,0,.5) 100%);
  }

  /* ---- landing: logo + title + scroll prompt ---- */
  .logo{
    position:fixed;
    top:max(20px,env(safe-area-inset-top));
    left:max(24px,env(safe-area-inset-left));
    z-index:12;
    height:24px; width:auto;
    opacity:.95;
    filter:drop-shadow(0 0 14px rgba(180,155,255,.3));
  }

  .landing{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    padding:2rem clamp(2rem, 6vw, 6rem);
    pointer-events:none;
    transition:opacity 0.5s ease;
  }
  .landing-inner{
    display:flex; align-items:flex-start; gap:clamp(2rem, 6vw, 5rem);
    max-width:1100px; width:100%;
  }
  .landing-title{
    font-family:"FoundryGridnik",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:clamp(20px, 5.4vw, 27px);
    font-weight:400; letter-spacing:0.02em; line-height:1.2;
    color:#f3f0ff;
    text-shadow:0 0 26px rgba(150,120,255,0.22);
    margin:0; width:var(--col-head); flex-shrink:0;
  }
  .landing-title em{
    font-style:normal; color:#DC846E;
  }
  .landing-sub{
    font-family:"Atkinson Hyperlegible Next",-apple-system,sans-serif;
    font-size:clamp(0.95rem, 1.8vw, 1.15rem);
    font-weight:400; line-height:1.65;
    color:rgba(200,195,215,0.75);
    text-shadow:0 0 60px rgba(10,8,20,0.9);
    margin:0;
  }

  .scroll-hint{
    position:fixed; bottom:32px; left:50%; transform:translateX(-50%);
    z-index:11; pointer-events:none;
    font-family:"FoundryGridnik",-apple-system,sans-serif;
    font-size:11px; letter-spacing:0.2em; text-transform:uppercase;
    color:rgba(200,195,220,0.4);
    animation:hint-pulse 2.5s ease-in-out infinite;
  }
  @keyframes hint-pulse{
    0%,100%{ opacity:0.4; transform:translateX(-50%) translateY(0); }
    50%{ opacity:0.7; transform:translateX(-50%) translateY(4px); }
  }

  /* ---- statement: the way we work doesn't work ---- */
  .content{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    padding:2rem clamp(2rem, 6vw, 6rem); pointer-events:none;
  }
  .statement{
    opacity:0; transform:translateY(8px);
    transition:opacity 0.6s ease, transform 0.8s ease;
  }
  .statement.show{
    opacity:1; transform:none;
  }
  .statement{
    display:flex; align-items:flex-start; gap:clamp(2rem, 6vw, 5rem);
    max-width:1100px; width:100%;
    text-align:left;
  }
  .statement h1{
    font-family:"FoundryGridnik",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:clamp(20px, 5.4vw, 27px);
    font-weight:400; letter-spacing:0.02em; line-height:1.2;
    color:#f3f0ff;
    text-shadow:0 0 26px rgba(150,120,255,0.22);
    margin:0; width:var(--col-head); flex-shrink:0;
  }
  .statement h1 em{
    font-style:normal; color:rgba(165,150,200,0.8);
  }
  .statement p{
    font-family:"Atkinson Hyperlegible Next",-apple-system,sans-serif;
    font-size:clamp(0.95rem, 1.8vw, 1.15rem);
    font-weight:400; line-height:1.65;
    color:rgba(200,195,215,0.75);
    max-width:32em; margin:0;
    text-shadow:0 0 60px rgba(10,8,20,0.9);
  }
</style>
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="sky-calm"></div>
  <div class="sky-overcast" id="skyOvercast"></div>
  <canvas id="stars" class="layer-stars"></canvas>
  <div class="haze" id="haze"></div>
  <img class="layer mist1" src="assets/mist1.png" alt="" decoding="async" />
  <canvas class="clouds" id="cloudfx"></canvas>
  <img class="layer mist2" src="assets/mist2.png" alt="" decoding="async" />
</div>
<div class="vignette" aria-hidden="true"></div>

<!-- landing — first viewport, matches feeljoy.ai gate screen -->
<img class="logo" src="assets/joy-logo-white.png" alt="Joy" />
<div class="landing" id="landing">
  <div class="landing-inner">
    <h1 class="landing-title">design partner<br><em>portal</em></h1>
    <p class="landing-sub">scroll</p>
  </div>
</div>

<!-- statement — fades in during second viewport -->
<div class="content">
  <div class="statement" id="statement">
    <h1>the way we work<br><em>doesn't work</em></h1>
    <p>We hire people to do great work, then put their performance in their manager's hands. To see it, they must ask: how am I doing? To drive it, they must self-promote.</p>
  </div>
</div>

<div class="scroll-hint" id="scrollHint">scroll</div>

<script>
"use strict";

const scene      = document.querySelector(".scene");
const canvas     = document.getElementById("stars");
const sctx       = canvas.getContext("2d");
const elMist1    = document.querySelector(".mist1");
const elMist2    = document.querySelector(".mist2");
const elClouds   = document.querySelector(".clouds");
const landing    = document.getElementById("landing");
const statement  = document.getElementById("statement");
const skyOvercast= document.getElementById("skyOvercast");
const haze       = document.getElementById("haze");
const scrollHint = document.getElementById("scrollHint");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let W=0, H=0, DPR=1, running=true, rafId=0;
let starsFar=[], starsNear=[], starsDust=[];
let scrollP = 0;

function updateScroll(){
  const maxScroll = document.body.scrollHeight - window.innerHeight;
  scrollP = maxScroll > 0 ? Math.min(1, Math.max(0, window.scrollY / maxScroll)) : 0;

  /* ---- phase 1: landing fades out (0 → 0.33 of total scroll) ---- */
  const landP = Math.min(1, scrollP / 0.33);
  landing.style.opacity = 1 - landP;

  /* ---- phase 2: sky transition (0.25 → 0.7 of total scroll) ---- */
  const skyP = Math.max(0, Math.min(1, (scrollP - 0.25) / 0.45));

  skyOvercast.style.opacity = skyP;

  const hazeP = Math.max(0, (skyP - 0.15) / 0.85);
  haze.style.opacity = hazeP * 0.9;

  canvas.style.opacity = 1 - skyP;

  // clouds shift cooler
  const hue = skyP * 30;
  const sat = 1 - skyP * 0.25;
  const bri = 1 - skyP * 0.12;
  const cloudFilter = `hue-rotate(${hue}deg) saturate(${sat}) brightness(${bri})`;
  elClouds.style.filter = cloudFilter;
  elMist1.style.filter  = cloudFilter;
  elMist2.style.filter  = cloudFilter;

  /* ---- phase 3: statement appears (0.55 → 1.0 of total scroll) ---- */
  const textP = Math.max(0, (scrollP - 0.55) / 0.45);
  if(textP > 0.2) statement.classList.add("show");
  else statement.classList.remove("show");

  // scroll hint fades out early
  scrollHint.style.opacity = Math.max(0, 1 - scrollP * 5);
}

window.addEventListener("scroll", updateScroll, { passive:true });

/* ---- starfield + clouds + mist: verbatim feeljoy.ai ---- */
function rand(a,b){ return a + Math.random()*(b-a); }
function mk(rmin,rmax,amin,amax,twmin,twmax){
  const roll = Math.random();
  const col = roll < 0.16 ? "255,228,196" : (roll < 0.42 ? "201,216,255" : "255,255,255");
  return { x:Math.random(), y:Math.random(), r:rand(rmin,rmax),
           base:rand(amin,amax), tw:rand(twmin,twmax), ph:Math.random()*6.2832, col };
}
function buildStars(){
  const area = (W*H)/(DPR*DPR);
  const dense = matchMedia("(pointer:coarse)").matches ? 0.5 : 1;
  const nf = Math.min(9000*dense,  Math.round(area/105*dense));
  const nn = Math.min(600*dense,   Math.round(area/650*dense));
  const nd = Math.min(10000*dense,  Math.round(area/36*dense));
  starsFar=[]; starsNear=[]; starsDust=[];
  for(let i=0;i<nf;i++) starsFar.push(mk(0.35,0.95, 0.16,0.5, 0.4,1.3));
  for(let i=0;i<nn;i++) starsNear.push(mk(0.7,1.7, 0.35,0.9, 0.8,2.2));
  for(let i=0;i<nd;i++) starsDust.push(mk(0.18,0.5, 0.05,0.2, 0.3,1.0));
}
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = Math.floor(window.innerWidth*DPR);
  H = Math.floor(window.innerHeight*DPR);
  canvas.width=W; canvas.height=H;
  canvas.style.width=window.innerWidth+"px";
  canvas.style.height=window.innerHeight+"px";
  buildStars();
  cloudResize();
}

let cgl=null, cU={}, cloudReady=false;
(function cloudInit(){
  try{ cgl = elClouds.getContext("webgl", {alpha:true, premultipliedAlpha:true, antialias:false}); }catch(e){ cgl=null; }
  if(!cgl){ elClouds.style.background="center bottom / 100% auto no-repeat url('assets/clouds.png')"; return; }
  const VS="attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}";
  const FS=[
    "precision highp float;",
    "uniform sampler2D uTex; uniform vec2 uRes; uniform float uTexAspect; uniform float uTime; uniform float uAmp;",
    "void main(){",
    "  vec2 suv = gl_FragCoord.xy / uRes;",
    "  float chUV = (uRes.x/uRes.y) / uTexAspect;",
    "  float tu = suv.x;",
    "  float tv = suv.y / chUV;",
    "  float win = smoothstep(1.0, 0.45, tv);",
    "  vec2 disp = vec2(",
    "    sin(tu*3.0 + uTime*0.35) + 0.5*sin(tv*4.5 - uTime*0.27),",
    "    cos(tu*2.5 - uTime*0.30) + 0.5*cos(tv*3.5 + uTime*0.23)",
    "  ) * uAmp * win;",
    "  vec2 tc = vec2(tu, tv) + disp;",
    "  if(tc.y > 1.0){ gl_FragColor = vec4(0.0); return; }",
    "  tc.x = clamp(tc.x, 0.0, 1.0);",
    "  tc.y = max(tc.y, 0.0);",
    "  gl_FragColor = texture2D(uTex, tc);",
    "}"
  ].join("\n");
  function sh(ty,s){ const o=cgl.createShader(ty); cgl.shaderSource(o,s); cgl.compileShader(o); if(!cgl.getShaderParameter(o,cgl.COMPILE_STATUS)) console.error(cgl.getShaderInfoLog(o)); return o; }
  const prog=cgl.createProgram();
  cgl.attachShader(prog,sh(cgl.VERTEX_SHADER,VS));
  cgl.attachShader(prog,sh(cgl.FRAGMENT_SHADER,FS));
  cgl.linkProgram(prog); cgl.useProgram(prog);
  const buf=cgl.createBuffer(); cgl.bindBuffer(cgl.ARRAY_BUFFER,buf);
  cgl.bufferData(cgl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),cgl.STATIC_DRAW);
  const pl=cgl.getAttribLocation(prog,"p"); cgl.enableVertexAttribArray(pl); cgl.vertexAttribPointer(pl,2,cgl.FLOAT,false,0,0);
  ["uTex","uRes","uTexAspect","uTime","uAmp"].forEach((n)=>cU[n]=cgl.getUniformLocation(prog,n));
  cgl.uniform1i(cU.uTex,0); cgl.uniform1f(cU.uTexAspect,1440/497); cgl.uniform1f(cU.uAmp,0.01);
  const tex=cgl.createTexture(); cgl.activeTexture(cgl.TEXTURE0); cgl.bindTexture(cgl.TEXTURE_2D,tex);
  cgl.texParameteri(cgl.TEXTURE_2D,cgl.TEXTURE_WRAP_S,cgl.CLAMP_TO_EDGE);
  cgl.texParameteri(cgl.TEXTURE_2D,cgl.TEXTURE_WRAP_T,cgl.CLAMP_TO_EDGE);
  cgl.texParameteri(cgl.TEXTURE_2D,cgl.TEXTURE_MIN_FILTER,cgl.LINEAR);
  cgl.texParameteri(cgl.TEXTURE_2D,cgl.TEXTURE_MAG_FILTER,cgl.LINEAR);
  cgl.texImage2D(cgl.TEXTURE_2D,0,cgl.RGBA,1,1,0,cgl.RGBA,cgl.UNSIGNED_BYTE,new Uint8Array([0,0,0,0]));
  cgl.pixelStorei(cgl.UNPACK_FLIP_Y_WEBGL,true);
  cgl.pixelStorei(cgl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);
  const img=new Image();
  img.onload=()=>{ cgl.bindTexture(cgl.TEXTURE_2D,tex); cgl.texImage2D(cgl.TEXTURE_2D,0,cgl.RGBA,cgl.RGBA,cgl.UNSIGNED_BYTE,img); cloudReady=true; };
  img.src="assets/clouds.png";
})();

function cloudResize(){
  if(!cgl) return;
  elClouds.width=W; elClouds.height=H;
  elClouds.style.width=window.innerWidth+"px"; elClouds.style.height=window.innerHeight+"px";
  cgl.viewport(0,0,W,H); cgl.uniform2f(cU.uRes,W,H);
}
function cloudRender(time){
  if(!cgl||!cloudReady) return;
  cgl.uniform1f(cU.uTime,time);
  cgl.clearColor(0,0,0,0); cgl.clear(cgl.COLOR_BUFFER_BIT);
  cgl.drawArrays(cgl.TRIANGLES,0,3);
}

const SLOW=0.4;
let t=0, lastNow=performance.now();

function drawStars(layer, dx, dy, twT, round){
  for(let i=0;i<layer.length;i++){
    const s=layer[i];
    let x=(s.x*W + dx) % W; if(x<0) x+=W;
    let y=(s.y*H + dy) % H; if(y<0) y+=H;
    let a=s.base*(0.5 + 0.5*Math.sin(twT*s.tw + s.ph));
    if(a<=0.01) continue;
    const rr=s.r*DPR*(1 - 0.5*(y/H));
    sctx.fillStyle="rgba("+s.col+","+a.toFixed(3)+")";
    if(round){ sctx.beginPath(); sctx.arc(x,y,rr,0,6.2832); sctx.fill(); }
    else{ sctx.fillRect(x-rr, y-rr, rr*2, rr*2); }
  }
}

let shoot=null, shootIn=rand(4,10);
function spawnShoot(){
  const dir = Math.random()<0.5 ? 1 : -1;
  const speed = rand(0.8,1.3)*W;
  shoot = {
    x:(dir>0 ? rand(0.05,0.5) : rand(0.5,0.95))*W,
    y:rand(0.06,0.30)*H,
    vx:dir*speed*rand(0.7,0.9),
    vy:speed*rand(0.30,0.48),
    t:0, dur:rand(0.8,1.2)
  };
}
function drawShoot(dt){
  if(!shoot){ shootIn-=dt; if(shootIn<=0){ spawnShoot(); shootIn=rand(10,20); } return; }
  shoot.t+=dt;
  const p=shoot.t/shoot.dur;
  if(p>=1){ shoot=null; return; }
  shoot.x+=shoot.vx*dt; shoot.y+=shoot.vy*dt;
  const fade=Math.sin(p*Math.PI);
  const zone=1-Math.max(0,(shoot.y/H-0.42)/0.24);
  const a=fade*Math.max(0,Math.min(1,zone))*0.9;
  if(a<=0.01) return;
  const tx=shoot.x-shoot.vx*0.14, ty=shoot.y-shoot.vy*0.14;
  const g=sctx.createLinearGradient(tx,ty,shoot.x,shoot.y);
  g.addColorStop(0,"rgba(255,246,235,0)");
  g.addColorStop(1,"rgba(255,246,235,"+a.toFixed(3)+")");
  sctx.strokeStyle=g; sctx.lineWidth=1.6*DPR; sctx.lineCap="round";
  sctx.beginPath(); sctx.moveTo(tx,ty); sctx.lineTo(shoot.x,shoot.y); sctx.stroke();
}

function setT(el,x,y,s){
  if(el) el.style.transform="translate(calc(-50% + "+x.toFixed(1)+"px), calc(-50% + "+y.toFixed(1)+"px)) scale("+s.toFixed(3)+")";
}
function applyLayers(){
  const w=window.innerWidth, h=window.innerHeight;
  setT(elMist1, Math.sin(t*0.060)*0.050*w, Math.cos(t*0.045)*0.024*h, 1.0);
  setT(elMist2, Math.sin(t*0.090+2.0)*0.090*w, Math.cos(t*0.070+1.0)*0.044*h, 1.02+0.015*Math.sin(t*0.05));
}

function frame(now){
  if(!running) return;
  let dt=(now-lastNow)/1000; lastNow=now; if(dt>0.05) dt=0.05;
  t += dt*SLOW;

  sctx.clearRect(0,0,W,H);
  if(scrollP < 0.95){
    drawStars(starsDust, t*0.7*DPR,  t*-0.35*DPR, t*0.8, false);
    drawStars(starsFar,  t*1.5*DPR,  t*-0.7*DPR,  t*1.0, false);
    drawStars(starsNear, t*3.0*DPR,  t*-1.4*DPR,  t*1.6, true);
    drawShoot(dt);
  }
  applyLayers();
  cloudRender(t*1.5);
  rafId=requestAnimationFrame(frame);
}

/* ---- Reveal ---- */
(function revealScene(){
  let done = false;
  const go = ()=>{ if(done) return; done = true; requestAnimationFrame(()=>scene.classList.add("ready")); };
  window.addEventListener("load", go);
  setTimeout(go, 1500);
})();

document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){ running=false; if(rafId) cancelAnimationFrame(rafId); }
  else if(!reduceMotion){ running=true; lastNow=performance.now(); rafId=requestAnimationFrame(frame); }
});
window.addEventListener("resize", ()=>{ resize(); updateScroll(); }, { passive:true });

resize();
updateScroll();
if(reduceMotion){
  sctx.clearRect(0,0,W,H);
  drawStars(starsDust,0,0,0,false); drawStars(starsFar,0,0,0,false); drawStars(starsNear,0,0,0,true);
  applyLayers(); cloudRender(0);
} else {
  lastNow=performance.now(); running=true; rafId=requestAnimationFrame(frame);
}
</script>
</body>
</html>
